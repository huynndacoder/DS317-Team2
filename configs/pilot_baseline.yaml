# Pilot baseline configuration — DS317 DataMine research Purchase, nhãn 12 tháng.
# Nguồn: docs/NEXT_AGENT_PLAN.md (P0), docs/label_rules.md,
#        scripts/gold/gold_spec.py, output/gold/research_v1/*.
# Mọi con số đánh dấu "assumption" là giả định chưa chứng minh, không phải sự thật.

scope:
  loan_purpose: "P"                 # Purchase-only
  horizon_months: 12                # nhãn quá hạn nghiêm trọng/REO trong 12 kỳ đầu
  label_path: "output/labels/cohort=*/data.parquet"
  label_version: "v3"               # theo docs/label_rules.md §12-13
  eligible_only: true               # label_status <> unknown & window_mature & cohort_mature
  source: "output/gold/research_v1" # research_v1 giữ nguyên; pilot ghi vào research_v2

features:
  whitelist:                        # 18 cột, từ gold_spec.py BASELINE (không thay đổi)
    - original_upb
    - original_loan_term
    - original_interest_rate
    - ltv
    - cltv
    - dti
    - mi_percentage
    - number_of_units
    - number_of_borrowers
    - credit_score
    - first_time_homebuyer_flag
    - channel
    - property_type
    - property_state
    - occupancy_status
    - prepayment_penalty_flag
    - super_conforming_flag
    - harp_indicator
  numeric:
    - original_upb
    - original_loan_term
    - original_interest_rate
    - ltv
    - cltv
    - dti
    - mi_percentage
    - number_of_units
    - credit_score
  categorical:
    - first_time_homebuyer_flag
    - channel
    - property_type
    - property_state
    - occupancy_status
    - prepayment_penalty_flag
    - super_conforming_flag
    - harp_indicator
    - number_of_borrowers   # xuất hiện dưới dạng one/multiple/NULL (VARCHAR), không phải số
  identifier:
    - loan_id                      # không vào X
  split_metadata:
    - cohort
    - first_payment_date
    - label_window_start
    - label_window_end
  audit_only:
    - label_status
    - eligible_for_primary_study
    - primary_exclusion_reason
    - label_reason
    - observed_month_count_in_window
    - first_event_month
    - termination_code
    - termination_month
    - performance_cutoff
    - window_mature
    - cohort_mature
    - quality_flags
  excluded_from_baseline:
    - vantage_score_4
    - valuation_method
    - seller_name
    - product_type
    - interest_only_indicator
    - maturity_date
    - postal_code
    - msa
    - pre_harp_loan_id
    - program_indicator
    - quarter
    - loan_purpose
  raw_trace:
    - number_of_borrowers_raw      # giữ ở audit, chặn lọt vào X

label:
  target: "label_12m"              # {0,1,NULL}; NULL không bao giờ thành 0
  domain: "{0,1,NULL}"
  reporting_lag_months: 3          # ASSUMPTION: Freddie Mac không công bố "as of" date
  reporting_lag_assumption: true   # xấp xỉ nhịp phát hành quý, chưa đối chiếu timestamp
  cutoff_per_cohort: true          # performance_cutoff = max(monthly_reporting_period) theo partition

split:
  # Pilot: cửa sổ 5 năm, test phát triển 2019. Holdout 2024 KHÔNG tham gia pilot.
  regime: "pilot_p2"
  fit_date: 2016-01                # bước A: chọn cấu hình/preprocessing
  train_tune_cohorts: "2009Q1-2013Q4"   # 5 năm đầy đủ, label ready <= 2016-01
  validation_cohorts: "2016Q1-2016Q4"   # chỉ chọn cấu hình khi nhãn ready <= 2019-01
  refit_date: 2019-01              # bước B: freeze/refit
  train_refit_cohorts: "2012Q1-2016Q4"  # 5 năm đầy đủ, label ready <= 2019-01
  development_test_cohorts: "2019Q1-2019Q4"
  development_test_year: 2019      # test phát triển, không dùng để chọn cấu hình
  holdout_year: 2024               # KHÔNG tham gia pilot; chưa có model metrics
  rule: "month_index(label_window_end) + reporting_lag <= month_index(T)"
  membership_axis: "cohort khởi tạo được chấm điểm"
  eligibility_axis: "label_window_end + lag <= fit_date (tính readiness)"
  # role membership độc lập (cho phép overlap): train_refit computed riêng rãi
  # khỏi train_tune/validation; verifier so sánh đầy đủ cả hai chiều.
  independent_membership: true

normalization:
  # Chỉ làm TRƯỚC chia tập, quy tắc cố định từ tài liệu, không dùng thống kê của nhãn.
  pre_split:
    - "giải mã sentinel theo bảng trong gold_spec.py (9999/999/99/9/7/000/'OTHER')"
    - "kiểm tra miền giá trị theo giai đoạn áp dụng (LTV/CLTV trước/sau 2018Q2)"
    - "biến dẫn xuất công thức cố định (has_mi, borrower_count_band nếu cần)"
    - "giữ cột raw cho cột đổi định nghĩa (number_of_borrowers_raw)"
  post_split_only:
    - "điền median/mode (fit trên Train)"
    - "scaling numeric (LR; fit trên Train)"
    - "học vocabulary / gộp nhóm hiếm theo tần suất (fit trên Train)"
    - "chọn feature theo tương quan nhãn"
    - "target encoding"
    - "resampling / SMOTE"
    - "winsorize / cắt outlier"
  constant_removal: "xác định trên Train, áp nguyên trạng sang valid/test"

model:
  seed: 42
  algorithms:
    - name: "logistic_regression"
      type: "linear"
      penalty: "l2"
      max_iter: 1000
      convergence_required: true   # warning không hội tụ không coi là xong
      scaling: "median fit trên Train"
    - name: "xgboost"
      type: "tree"
      objective: "binary:logistic"
      method: "hist"
      # cấu hình gọn, ghi trước; không grid search/Optuna trong lượt này
      early_stopping: "chỉ dùng validation của bước A, sau đó khóa số cây trước refit bước B"
      scaling: "không scale numeric (ghi khác biệt so với LR trong config)"
  preprocessing_shared: true       # cùng candidate features, cùng loan IDs cho hai model
  missing_indicator: false
  class_weight: false              # không resample/SMOTE, không class_weight trong baseline đầu
  one_hot:
    handle_unknown: "ignore"
    sparse: true
    vocabulary_fit: "Train"
  categorical_missing: "UNKNOWN"
  numeric_impute: "median fit trên Train"

resources:
  memory_limit: "3GB"
  threads: 6
  spill_dir: ".label_tmp"
  model_threads: "2-4 (bắt đầu thấp, kiểm tra RAM thực tế)"
  one_heavy_process_at_a_time: true

sampling:
  enabled: false                   # mặc định không sampling nếu đủ tài nguyên
  strategy: "deterministic theo loan_id, seed cố định"  # nếu bật: cùng tập ID cho cả model
  target_based: false              # không sampling theo target
  keep_natural_distribution: true  # valid/test ở phân phối tự nhiên, ưu tiên toàn bộ

reporting:
  metrics:
    - "average_precision (AP, không trộn với trapezoidal PR-AUC)"
    - "roc_auc"
    - "brier_score"
    - "log_loss"
    - "capture_at_5pct"
    - "precision_at_5pct"
    - "lift_at_5pct"
  topk:
    batch_by: "cohort khởi tạo"
    k: "ceil(0.05 * batch_size)"
    tie_break: "loan_id cố định"
    lift_formula: "precision / prevalence (không dùng alpha=0.05 tuyệt đối khi k làm tròn)"
  aggregation: "per-quarter + pooled + mean per-quarter (tên rõ, không trộn)"
  no_positive_batch: "recall/lift/AUC = N/A, không giả 0"
  threshold_05: "không dùng 0.5 để thay Top-5% business evaluation"

provenance:
  # Hash của code/config/rule file liên quan + thông tin file đầu vào (size/mtime/schema).
  # Không hash/quét lại toàn bộ kho dữ liệu (~24 GB) không cần thiết.
  hash_algorithm: "sha256"
  files: []
  input_files: []
  generated_at: null
  label_version: "v3"
  research_version: "research_v2"
  config_hash: null          # điền sau khi chạy builder (hash của file config này)
  builder_version: "pilot_p2"
  # research_v1 giữ nguyên; pilot ghi vào research_v2, không ghi đè v1.
